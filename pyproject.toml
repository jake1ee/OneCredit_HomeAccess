[project]
name = "company-recommendation-system"
version = "0.0.0"
description = "Turn a company event feed into a similar-companies service with RabbitMQ and pgvector."
requires-python = ">=3.14,<3.15"
dependencies = [
  "aio-pika",
  "fastapi>=0.165.0",
  "fastembed>=0.9.1",
  "pgvector>=0.5.1",
  "psycopg[binary,pool]>=3.3.9",
  "pydantic-settings>=2.16.3",
  "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["producer"]  # provided by the assessment, left as is

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow non-ASCII text in docs (the README mock uses box-drawing characters)

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs the Postgres (and RabbitMQ) containers from docker-compose"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # test data mirrors real feed lines, which are long
